[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segmentation-demo"
version = "0.2.0"
description = "Reproducible RFM customer segmentation, validation, dashboard and API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.57,<2",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn==1.9.0",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "plotly>=5.18",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "jupyter>=1.0"]

[project.scripts]
customer-segmentation-train = "customer_segmentation.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
